<!DOCTYPE html>
<html xmlns:th="https;//thymeleaf.org">

<body>
    <div th:fragment="navigation" class="navigation">
        <th:block th:each="page : ${model.topLevelPages}">
        <div class="navigation-opt">
            <span th:if="${page.pageName} == ${model.name}" th:text="${page.pageName}"></span>
            <a th:unless="${page.pageName} == ${model.name}" th:href="${page.pagePath}" th:text="${page.pageName}"></a>
        </div>
        </th:block>
    </div>
</body>

</html>
